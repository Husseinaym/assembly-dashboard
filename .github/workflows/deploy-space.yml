# Deploys the website to the Hugging Face Space after every change on main.
# Only the current files are sent (no git history), and nothing confidential is in them:
# the database, the original Excel uploads and the private translation table live in the private dataset.
#
# One-time setup in this GitHub repository (Settings > Secrets and variables > Actions):
#   Secret   HF_TOKEN  = a Hugging Face token with write access to the Space
#   Variable HF_SPACE  = <hugging-face-user>/<space-name>
name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-space
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install and test
        working-directory: website
        run: |
          npm ci
          npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN secret or HF_SPACE variable is not set: nothing is deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - name: Refuse to publish private data
        if: steps.cfg.outputs.ready == 'true'
        run: |
          if find . -path ./.git -prune -o \( -name 'translations-ar.json' -o -name '*.db' -o -name '*.xlsx' -o -name '*.xls' -o -name '.env' \) -print | grep -q .; then
            echo "Private data files found in the repository. Deployment stopped."; exit 1
          fi
      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ready == 'true'
        with:
          python-version: '3.12'
      - name: Upload the current files to the Space
        if: steps.cfg.outputs.ready == 'true'
        run: |
          pip install --quiet huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              folder_path=".",
              repo_id=os.environ["HF_SPACE"],
              repo_type="space",
              commit_message="Deploy " + os.environ.get("GITHUB_SHA", "")[:7],
              ignore_patterns=[".git/**", ".github/**", ".claude/**", "scripts/**", "website/tests/**", "website/node_modules/**", "website/data/**"],
              delete_patterns=["website/**", "index.html", "style.css"],
          )
          PY
