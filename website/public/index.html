<!doctype html>
<html lang="en" dir="ltr">
<head>

  <title>Assembly Production · Production Data Analysis</title>
  <link rel="icon" href="/img/sews-e-icon.png" type="image/png">
  <link rel="preload" href="/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/app.css">
  <script>try { var th = localStorage.getItem('pda-theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch (e) {}</script>
  <script>/* Which filter bar this page will get, so its space is reserved before the data loads (prevents the page jumping). */
    (function () { var p = location.pathname; document.documentElement.setAttribute('data-fb', p === '/' ? 'home' : /^\/(defects|compliance|safety)/.test(p) ? 'seg' : /^\/reports\/(weekly|downloads)/.test(p) ? 'rep' : 'none'); })();</script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar" role="banner">
   <div class="topbar-main">
    <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false" aria-controls="topnav"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <a href="/" class="brand" data-link aria-label="Home">
      <img src="/img/sews-e-logo-wide-white.png" width="669" height="102" alt="Sumitomo Electric Wiring Systems (Europe) Ltd" class="brand-logo">
      <span class="brand-divider" aria-hidden="true"></span>
      <span class="brand-text"><strong id="brand-company">Assembly Production Department</strong><span id="brand-sub">Production Data Analysis · 6th of October, Egypt</span></span>
    </a>
    <div class="top-tools">
      <div class="search" role="search">
        <input id="search" type="search" placeholder="Search facility, line, defect, operator…" aria-label="Search" autocomplete="off">
        <div id="search-results" class="search-results" role="listbox" hidden></div>
      </div>
      <button class="icon-btn" id="btn-present" title="Presentation mode (full screen, pages rotate)" aria-label="Presentation mode"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 4.5v15l12-7.5z"/></svg></button>
      <button class="icon-btn" id="btn-theme" title="Light / dark mode" aria-label="Switch light or dark mode"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor"/></svg></button>
      <div id="user-box" class="user-box"></div>
    </div>
   </div>
   <nav id="topnav" class="topnav" aria-label="Main"></nav>
  </header>
  <div class="subbar">
    <nav id="breadcrumbs" class="breadcrumbs" aria-label="Breadcrumb"></nav>
    <div id="present-bar" class="present-bar" hidden></div>
  </div>
  <section id="filterbar" class="filterbar" aria-label="Filters"></section>
  <div class="layout">
    <aside id="sidemenu" class="sidemenu" aria-label="Section pages"></aside>
    <main id="main" class="main" tabindex="-1"></main>
  </div>
  <footer class="footer" id="footer"></footer>
  <div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <div class="modal-head"><h2 id="modal-title"></h2><button class="icon-btn" id="modal-close" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/js/app.js"></script>
